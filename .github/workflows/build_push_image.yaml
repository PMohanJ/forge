name: Build and push image to ghcr

on:
  push:
    branches:
      - forge-build
  pull_request:
    types: [closed]
    branches:
      - forge-build
  workflow_dispatch:

jobs:
  build-and-push:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get repo owner name in lower case
        id: repo
        run: |
          echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ steps.repo.outputs.owner_lc }}/continuum:latest .

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/${{ steps.repo.outputs.owner_lc }}/continuum:latest